services:
  db:
    image: postgres:18-alpine
    container_name: coach-planner-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coachplanner}
      POSTGRES_USER: ${POSTGRES_USER:-coachplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coachplanner} -d ${POSTGRES_DB:-coachplanner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api: # P3 (tasks.md T49) — `docker compose --profile full up`
    profiles: ["full"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-coachplanner}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-coachplanner}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # app.jwt.secret has no default outside the dev profile (T5's fail-fast design) — this
      # container runs no Spring profile at all, so it must be supplied explicitly.
      APP_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8080:8080"

volumes:
  pgdata:
