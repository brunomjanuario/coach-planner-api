spring:
  application:
    name: coach-planner-api
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema — never "update" (design.md)
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info # deliberately not "*" — INFRA-04/05
  endpoint:
    health:
      show-details: always # so the "db" component is visible, not just top-level status

logging:
  structured:
    format:
      console: ecs # ECS JSON includes MDC context automatically — carries CorrelationIdFilter's requestId
